name = "covenant-buy-agent"
main = "app/workers/buy_agent/index.js"
compatibility_date = "2025-12-17"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "covenant"
database_id = "5ab64e45-a78f-4692-939e-7eec3000b341"

[[durable_objects.bindings]]
name = "BUY_POLICY"
class_name = "BuyPolicyWorker"

[[durable_objects.bindings]]
name = "FUNDING_WALLET"
class_name = "FundingWalletWorker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BuyPolicyWorker", "FundingWalletWorker"]

[[rules]]
globs = ["**/*.yml", "**/*.yaml"]
type = "Text"
fallthrough = true
